[package]
name = "file_worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
worker-build = "0.8"
