[package]
name = "file_worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sha2 = "0.11"
getrandom = { version = "0.2", features = ["js"] }
percent-encoding = "2"

[dev-dependencies]
worker-build = "0.8"
