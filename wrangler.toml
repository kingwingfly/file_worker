name = "file-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "worker-build --release"

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "zcll"

[[d1_databases]]
binding = "DB"
database_name = "zcll"
database_id = "b09e0ae8-0ef5-418f-91b7-dbeb3d34ac72"

[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin/api/*"]

[vars]
# Cloudflare Access configuration — set these before deploy
CF_ACCESS_TEAM_DOMAIN = "kingwingfly.cloudflareaccess.com"
CF_ACCESS_AUD = "11577b8e233ee8ed3e6a255b6ea59a4d6574edb70442fe2d40eabd5952034e6c"
