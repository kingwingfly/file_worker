name = "file-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "worker-build --release"

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "<bucket_name>"

[[d1_databases]]
binding = "DB"
database_name = "<database_name>"
database_id = "<database_id>"

[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "<id>"

[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin/api/*"]

# Secrets are not declared here — set them with `npx wrangler secret put <name>`
# (and in `.dev.vars` for `wrangler dev`):
#   IDENTITY_SECRET — HMAC key for signing identity cookies (clips, likes, reports).
#   Generate with: openssl rand -base64 32
#   Without it, /api/identity and every clip route returns 500.

[vars]
# Cloudflare Access configuration — set these before deploy
CF_ACCESS_TEAM_DOMAIN = "<name>.cloudflareaccess.com"
CF_ACCESS_AUD = "<CF_ACCESS_AUD>"
