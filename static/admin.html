<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💫 管理</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .admin-section {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .admin-section h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .upload-zone {
      border: 3px dashed var(--soft-blue);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--pink);
      background: var(--light-pink);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-zone-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .upload-zone-text { font-weight: 500; }
    .upload-zone-hint { color: var(--text-light); font-size: 0.85rem; margin-top: 0.25rem; }

    .form-group {
      margin-top: 1rem;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 2px solid var(--soft-blue);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .form-group input:focus {
      border-color: var(--pink);
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.2);
    }

    .form-hint { color: var(--text-light); font-size: 0.8rem; margin-top: 0.2rem; }

    .btn-upload {
      display: block;
      width: 100%;
      margin-top: 1rem;
      background: var(--pink);
      color: var(--white);
      border: none;
      padding: 0.75rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-upload:hover { background: #FF9AAF; transform: scale(1.02); }
    .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .upload-progress {
      margin-top: 1rem;
      height: 6px;
      background: var(--soft-blue);
      border-radius: 3px;
      overflow: hidden;
    }

    .upload-progress-bar {
      height: 100%;
      background: var(--pink);
      border-radius: 3px;
      transition: width 0.15s;
      width: 0%;
    }

    .upload-progress-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.35rem;
    }

    .upload-result {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }

    .upload-result.success {
      background: #D5F5E3;
      color: #1E8449;
    }

    .upload-result.error {
      background: #FADBD8;
      color: #C0392B;
    }

    .clip-list {
      list-style: none;
    }

    .clip-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 0.75rem;
    }

    .clip-list-item:last-child { border-bottom: none; }

    .clip-list-name {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clip-list-size { font-size: 0.8rem; color: var(--text-light); white-space: nowrap; }

    .btn-delete {
      background: none;
      border: 1px solid #e0e0e0;
      color: var(--text-light);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-delete:hover { background: #FADBD8; color: #C0392B; border-color: #F5B7B1; }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .admin-header .back-link {
      color: var(--pink);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .admin-header .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1 class="site-title">
        <span class="title-sparkle">🔐</span>
        管理
        <span class="title-sparkle">✨</span>
      </h1>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h2>📤 投喂切片</h2>
      <a href="/" class="back-link">← 回画廊</a>
    </div>

    <!-- Upload Section -->
    <div class="admin-section">
      <h2>🍰 上传新切片</h2>

      <div class="upload-zone" id="upload-zone">
        <div class="upload-zone-icon">🐾</div>
        <div class="upload-zone-text">点击或拖拽到此处</div>
        <div class="upload-zone-hint">支持 JPG, PNG, GIF, MP4, WEBM, MP3, WAV 等</div>
        <input type="file" id="file-input" accept="image/*,video/*,audio/*">
      </div>

      <div class="form-group">
        <label for="custom-path">📁 自定义路径 (选填)</label>
        <input type="text" id="custom-path" placeholder="例如: oshi/2024/ 或 my-clip.mp4">
        <div class="form-hint">留空则自动生成路径</div>
      </div>

      <button class="btn-upload" id="upload-btn" disabled>
        🚀 上传
      </button>

      <div class="upload-progress" hidden id="progress-wrapper">
        <div class="upload-progress-bar" id="progress-bar" style="width:0%"></div>
        <div class="upload-progress-text" id="progress-text"></div>
      </div>

      <div class="upload-result" hidden id="upload-result"></div>
    </div>

    <!-- Clip List Section -->
    <div class="admin-section">
      <h2>📋 切片列表</h2>
      <ul class="clip-list" id="admin-clip-list">
        <li class="clip-list-item" style="justify-content:center; color: var(--text-light);">
          加载中...
        </li>
      </ul>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-paws">🐾 🐾 🐾</div>
    <p>💖 with 🐾</p>
  </footer>

  <script>
    'use strict';

    const fileInput = document.getElementById('file-input');
    const uploadZone = document.getElementById('upload-zone');
    const uploadBtn = document.getElementById('upload-btn');
    const progressWrapper = document.getElementById('progress-wrapper');
    const progressBar = document.getElementById('progress-bar');
    const uploadResult = document.getElementById('upload-result');
    const customPath = document.getElementById('custom-path');
    const clipList = document.getElementById('admin-clip-list');
    let selectedFile = null;

    // File selection
    fileInput.addEventListener('change', () => {
      selectedFile = fileInput.files[0];
      uploadBtn.disabled = !selectedFile;
      if (selectedFile) {
        document.querySelector('.upload-zone-text').textContent = selectedFile.name;
        document.querySelector('.upload-zone-hint').textContent =
          formatSize(selectedFile.size) + ' — ' + (selectedFile.type || 'unknown');
      }
    });

    // Drag & drop
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) {
        selectedFile = file;
        fileInput.files = e.dataTransfer.files;
        uploadBtn.disabled = false;
        document.querySelector('.upload-zone-text').textContent = file.name;
        document.querySelector('.upload-zone-hint').textContent =
          formatSize(file.size) + ' — ' + (file.type || 'unknown');
      }
    });

    // Upload — multipart for large files
    const CHUNK_SIZE = 25 * 1024 * 1024; // 25 MB per chunk

    uploadBtn.addEventListener('click', () => {
      if (!selectedFile) return;
      doMultipartUpload(selectedFile, customPath.value.trim());
    });

    async function doMultipartUpload(file, path) {
      uploadBtn.disabled = true;
      uploadBtn.textContent = '⏳ 准备上传...';
      progressWrapper.hidden = false;
      progressBar.style.width = '0%';
      document.getElementById('progress-text').textContent = '';
      uploadResult.hidden = true;

      let uploadId = null;
      let key = null;

      try {
        // 1. Start multipart upload
        uploadBtn.textContent = '⏳ 创建上传...';
        const startResp = await fetch('/admin/api/upload/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: file.name,
            content_type: file.type || 'application/octet-stream',
            path: path || undefined,
          }),
        });
        if (!startResp.ok) {
          throw new Error(`Start failed: ${startResp.status}`);
        }
        const startData = await startResp.json();
        uploadId = startData.upload_id;
        key = startData.key;

        // 2. Upload chunks
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        const parts = [];
        let uploadedBytes = 0;

        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunk = file.slice(start, end);

          uploadBtn.textContent = `⏳ 上传中 ${i + 1}/${totalChunks}...`;

          const part = await uploadChunk(uploadId, key, i + 1, chunk, (chunkLoaded) => {
            const total = uploadedBytes + chunkLoaded;
            const pct = Math.round((total / file.size) * 100);
            progressBar.style.width = pct + '%';
            document.getElementById('progress-text').textContent =
              `${formatSize(total)} / ${formatSize(file.size)}`;
          });

          parts.push(part);
          uploadedBytes += chunk.size;
        }

        // 3. Complete
        uploadBtn.textContent = '⏳ 完成中...';
        progressBar.style.width = '100%';
        const completeResp = await fetch(
          `/admin/api/upload/complete?upload_id=${encodeURIComponent(uploadId)}&key=${encodePath(key)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              parts: parts.map(p => ({ n: p.part_number, etag: p.etag })),
              content_type: file.type || 'application/octet-stream',
            }),
          }
        );
        if (!completeResp.ok) {
          throw new Error(`Complete failed: ${completeResp.status}`);
        }
        const completeData = await completeResp.json();

        showResult(true, `✅ 上传成功! ${completeData.key} (${formatSize(completeData.size)})`);
        customPath.value = '';
        selectedFile = null;
        fileInput.value = '';
        document.querySelector('.upload-zone-text').textContent = '点击或拖拽到此处';
        document.querySelector('.upload-zone-hint').textContent = '支持图片、视频、音频';
        loadClips();

      } catch (err) {
        console.error('Upload error:', err);
        showResult(false, `❌ 上传失败: ${err.message}`);
        // Abort multipart upload on error
        if (uploadId && key) {
          try {
            await fetch(
              `/admin/api/upload?upload_id=${encodeURIComponent(uploadId)}&key=${encodePath(key)}`,
              { method: 'DELETE' }
            );
          } catch (_) { /* ignore abort errors */ }
        }
      } finally {
        uploadBtn.disabled = true;
        uploadBtn.textContent = '🚀 上传';
        setTimeout(() => { progressWrapper.hidden = true; }, 1500);
      }
    }

    function uploadChunk(uploadId, key, partNumber, blob, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(e.loaded);
          }
        });

        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(JSON.parse(xhr.responseText));
          } else {
            reject(new Error(`Part ${partNumber}: HTTP ${xhr.status}`));
          }
        });

        xhr.addEventListener('error', () => reject(new Error(`Part ${partNumber}: network error`)));

        const params = new URLSearchParams({
          upload_id: uploadId,
          key: key,
          n: partNumber,
        });
        xhr.open('PUT', `/admin/api/upload/part?${params}`);
        xhr.send(blob);
      });
    }

    function showResult(success, msg) {
      uploadResult.hidden = false;
      uploadResult.className = 'upload-result ' + (success ? 'success' : 'error');
      uploadResult.textContent = msg;
    }

    // Load clips
    async function loadClips() {
      try {
        const resp = await fetch('/admin/api/files');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        renderClipList(data.files || []);
      } catch (err) {
        clipList.innerHTML = `<li class="clip-list-item" style="justify-content:center; color: #C0392B;">
          ❌ 加载失败: ${err.message}
        </li>`;
      }
    }

    function renderClipList(files) {
      if (files.length === 0) {
        clipList.innerHTML = `<li class="clip-list-item" style="justify-content:center; color: var(--text-light);">
          💤 还没有切片~
        </li>`;
        return;
      }

      clipList.innerHTML = files.map(f => `
        <li class="clip-list-item">
          <span class="clip-list-name" title="${escapeHtml(f.key)}">✨ ${escapeHtml(f.key)}</span>
          <span class="clip-list-size">${formatSize(f.size)}</span>
          <button class="btn-delete" onclick="deleteClip('${escapeAttr(f.key)}')">🗑 删除</button>
        </li>
      `).join('');
    }

    async function deleteClip(key) {
      if (!confirm(`确认删除 "${key}"?`)) return;
      try {
        const resp = await fetch(`/admin/api/files/${encodePath(key)}`, { method: 'DELETE' });
        if (resp.ok) {
          loadClips();
        } else {
          alert('删除失败: ' + resp.status);
        }
      } catch (err) {
        alert('网络错误: ' + err.message);
      }
    }

    function encodePath(key) {
      return key.split('/').map(encodeURIComponent).join('/');
    }

    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(i > 0 ? 1 : 0) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Initial load
    loadClips();
  </script>
</body>
</html>
