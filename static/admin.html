<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💫 管理</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .admin-section {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .admin-section h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .upload-zone {
      border: 3px dashed var(--soft-blue);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--pink);
      background: var(--light-pink);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-zone-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .upload-zone-text { font-weight: 500; }
    .upload-zone-hint { color: var(--text-light); font-size: 0.85rem; margin-top: 0.25rem; }

    .form-group {
      margin-top: 1rem;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 2px solid var(--soft-blue);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .form-group input:focus {
      border-color: var(--pink);
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.2);
    }

    .form-hint { color: var(--text-light); font-size: 0.8rem; margin-top: 0.2rem; }

    .btn-upload {
      display: block;
      width: 100%;
      margin-top: 1rem;
      background: var(--pink);
      color: var(--white);
      border: none;
      padding: 0.75rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-upload:hover { background: #FF9AAF; transform: scale(1.02); }
    .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #progress-wrapper {
      margin-top: 1rem;
    }

    .upload-progress {
      height: 6px;
      background: var(--soft-blue);
      border-radius: 3px;
      overflow: hidden;
    }

    .upload-progress-bar {
      height: 100%;
      background: var(--pink);
      border-radius: 3px;
      transition: width 0.15s;
      width: 0%;
    }

    .upload-progress-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.35rem;
    }

    .upload-wake-hint {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 0.2rem;
    }

    .upload-result {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }

    .upload-result.success {
      background: #D5F5E3;
      color: #1E8449;
    }

    .upload-result.error {
      background: #FADBD8;
      color: #C0392B;
    }

    .file-list {
      list-style: none;
    }

    .file-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 0.75rem;
    }

    .file-list-item:last-child { border-bottom: none; }

    .file-list-name {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-list-size {
      font-size: 0.8rem;
      color: var(--text-light);
      white-space: nowrap;
      min-width: 5.5rem;
      text-align: right;
    }

    .file-list-actions {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .btn-file-action {
      background: none;
      border: 1px solid #e0e0e0;
      color: var(--text-light);
      padding: 0.25rem 0.6rem;
      min-width: 3.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-file-action:hover { background: #FADBD8; color: #C0392B; border-color: #F5B7B1; }

    .btn-rename:hover { background: #D5F5E3; color: #1E8449; border-color: #A9DFBF; }

    .rename-dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .rename-dialog {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      min-width: 320px;
      max-width: 90vw;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }

    .rename-dialog h3 {
      margin-bottom: 0.75rem;
      font-size: 1.1rem;
    }

    .rename-dialog input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 2px solid var(--soft-blue);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
    }

    .rename-dialog input:focus {
      border-color: var(--pink);
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.2);
    }

    .rename-dialog .rename-hint {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.35rem;
    }

    .rename-dialog-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: flex-end;
    }

    .rename-dialog-actions button {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-rename-confirm {
      background: var(--pink);
      color: var(--white);
    }

    .btn-rename-confirm:hover { background: #FF9AAF; }
    .btn-rename-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-rename-cancel {
      background: #f0f0f0;
      color: var(--text);
    }

    .btn-rename-cancel:hover { background: #e0e0e0; }

    .duplicate-warning {
      background: #FCF3CF;
      border: 1px solid #F9E79F;
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      margin-top: 0.75rem;
      font-size: 0.9rem;
      display: none;
    }

    .duplicate-warning.show { display: block; }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .admin-header .back-link {
      color: var(--pink);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .admin-header .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1 class="site-title">
        <span class="title-sparkle">🔐</span>
        管理
        <span class="title-sparkle">✨</span>
      </h1>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h2>📤 上传管理</h2>
      <a href="/" class="back-link">← 回画廊</a>
    </div>

    <!-- Upload Section -->
    <div class="admin-section">
      <h2>🍰 上传文件</h2>

      <div class="upload-zone" id="upload-zone">
        <div class="upload-zone-icon">🐾</div>
        <div class="upload-zone-text">点击或拖拽到此处</div>
        <div class="upload-zone-hint">支持 JPG, PNG, GIF, MP4, WEBM, MP3, WAV 等</div>
        <input type="file" id="file-input" accept="image/*,video/*,audio/*">
      </div>

      <div class="form-group">
        <label for="custom-path">📁 自定义路径 (选填)</label>
        <input type="text" id="custom-path" placeholder="例如: oshi/2024/ 或 my-file.mp4">
        <div class="form-hint">留空则自动生成路径</div>
      </div>

      <button class="btn-upload" id="upload-btn" disabled>
        🚀 上传
      </button>

      <div class="duplicate-warning" id="dup-warning" hidden>
        ⚠️ 文件 "<span id="dup-key"></span>" 已存在。是否覆盖？
        <div style="margin-top:0.5rem;display:flex;gap:0.5rem;">
          <button class="btn-rename-confirm" id="btn-overwrite" style="font-size:0.85rem;padding:0.4rem 1rem;">覆盖</button>
          <button class="btn-rename-cancel" id="btn-cancel-overwrite" style="font-size:0.85rem;padding:0.4rem 1rem;">取消</button>
        </div>
      </div>

      <div id="progress-wrapper" hidden>
        <div class="upload-progress">
          <div class="upload-progress-bar" id="progress-bar" style="width:0%"></div>
        </div>
        <div class="upload-progress-text" id="progress-text"></div>
        <div class="upload-wake-hint" id="wake-hint" hidden></div>
      </div>

      <div class="upload-result" hidden id="upload-result"></div>
    </div>

    <!-- File List Section -->
    <div class="admin-section">
      <h2>📋 文件列表</h2>
      <ul class="file-list" id="admin-file-list">
        <li class="file-list-item" style="justify-content:center; color: var(--text-light);">
          加载中...
        </li>
      </ul>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-paws">🐾 🐾 🐾</div>
    <p>💖 with 🐾</p>
  </footer>

  <script>
    'use strict';

    const fileInput = document.getElementById('file-input');
    const uploadZone = document.getElementById('upload-zone');
    const uploadBtn = document.getElementById('upload-btn');
    const progressWrapper = document.getElementById('progress-wrapper');
    const progressBar = document.getElementById('progress-bar');
    const uploadResult = document.getElementById('upload-result');
    const customPath = document.getElementById('custom-path');
    const fileListEl = document.getElementById('admin-file-list');
    let selectedFile = null;

    // File selection
    fileInput.addEventListener('change', () => {
      selectedFile = fileInput.files[0];
      uploadBtn.disabled = !selectedFile;
      if (selectedFile) {
        document.querySelector('.upload-zone-text').textContent = selectedFile.name;
        document.querySelector('.upload-zone-hint').textContent =
          formatSize(selectedFile.size) + ' — ' + (selectedFile.type || 'unknown');
      }
    });

    // Drag & drop
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) {
        selectedFile = file;
        fileInput.files = e.dataTransfer.files;
        uploadBtn.disabled = false;
        document.querySelector('.upload-zone-text').textContent = file.name;
        document.querySelector('.upload-zone-hint').textContent =
          formatSize(file.size) + ' — ' + (file.type || 'unknown');
      }
    });

    // Screen Wake Lock — a multi-GB upload takes long enough that an idle
    // screen timeout would otherwise suspend the machine mid-transfer.
    //
    // The browser releases the lock by itself whenever the page stops being
    // visible, and does not re-take it when the page comes back. The
    // visibilitychange handler below is therefore load-bearing, not a nicety:
    // without it, one tab switch during a long upload silently ends the lock.
    //
    // Acquisition is anchored to the click that starts an upload, never to the
    // async work that follows it. Every engine documents the gesture-time
    // pattern, and WebKit is the one that appears to enforce it: a request
    // issued after the check-key round trip has outlived its transient
    // activation. Failure is not fatal — the hint says so and the upload runs.
    const wakeHint = document.getElementById('wake-hint');
    let wakeLock = null;
    let wakeLockPending = null;
    let wakeLockWanted = false;
    let uploadInProgress = false;

    async function acquireWakeLock(site) {
      wakeLockWanted = true;
      if (!('wakeLock' in navigator)) return false;
      // Two callers (upload start, visibilitychange) can race here. Without
      // this guard both requests resolve, the second overwrites `wakeLock`,
      // and the first sentinel is orphaned — the screen then stays awake after
      // the upload finishes, with nothing left holding a reference to release.
      if (wakeLock) return true;
      if (wakeLockPending) {
        try { await wakeLockPending; } catch (_) { /* the first caller logs it */ }
        return !!wakeLock;
      }
      try {
        wakeLockPending = navigator.wakeLock.request('screen');
        wakeLock = await wakeLockPending;
        wakeLock.addEventListener('release', () => { wakeLock = null; });
        // releaseWakeLock() may have run while the request was in flight — the
        // admin cancelled the overwrite dialog, say. It had no sentinel to
        // release then, so honour the intent now instead of leaking this one.
        if (!wakeLockWanted) {
          releaseWakeLock();
          return false;
        }
        return true;
      } catch (err) {
        // Safari denies with a bare NotAllowedError for several unrelated
        // reasons — Low Power Mode, a hidden or not-yet-fully-active document,
        // an insecure origin — and the message never says which. Log the state
        // that tells them apart, plus which call site asked.
        const detail =
          `site=${site} visibility=${document.visibilityState} secure=${isSecureContext}`;
        if (site === 'visibilitychange') {
          // Known WebKit behaviour: the document can report 'visible' before it
          // is fully active again, so a re-acquire fails routinely on Safari.
          // The on-page hint already covers it — don't shout in the console.
          console.debug(`Wake lock not re-acquired (${err.name}) — ${detail}`);
        } else {
          console.warn(`Wake lock refused (${err.name}: ${err.message}) — ${detail}`);
        }
        wakeLock = null;
        return false;
      } finally {
        wakeLockPending = null;
      }
    }

    function releaseWakeLock() {
      wakeLockWanted = false;
      if (!wakeLock) return;
      wakeLock.release().catch(() => { /* already gone */ });
      wakeLock = null;
    }

    function setWakeHint(held) {
      let msg;
      if (!('wakeLock' in navigator)) {
        msg = '⚠️ 此浏览器不支持屏幕常亮，上传期间请勿让设备休眠';
      } else if (held) {
        msg = '☕ 已阻止设备休眠';
      } else {
        msg = '⚠️ 浏览器拒绝阻止休眠，请勿让设备休眠';
      }
      wakeHint.textContent = msg + ' · 请勿关闭此页面';
      wakeHint.hidden = false;
    }

    document.addEventListener('visibilitychange', () => {
      if (!uploadInProgress || document.visibilityState !== 'visible') return;
      acquireWakeLock('visibilitychange').then(setWakeHint);
    });

    // Closing the tab mid-upload kills the transfer and strands the multipart
    // upload in R2 — the abort call lives in doMultipartUpload's catch, which
    // never runs if the page is gone. Warn before that happens.
    //
    // Browsers deliberately ignore any custom message here and show their own
    // generic dialog; the only thing that matters is that a handler cancelled
    // the event. Chrome additionally requires the page to have had a user
    // gesture, which an upload the admin clicked to start always satisfies.
    window.addEventListener('beforeunload', (e) => {
      if (!uploadInProgress) return;
      e.preventDefault();
      e.returnValue = ''; // legacy Chrome/Safari spelling, still needed
    });

    // Upload — multipart for large files
    const CHUNK_SIZE = 25 * 1024 * 1024; // 25 MB per chunk
    const dupWarning = document.getElementById('dup-warning');
    const dupKeyEl = document.getElementById('dup-key');
    const btnOverwrite = document.getElementById('btn-overwrite');
    const btnCancelOverwrite = document.getElementById('btn-cancel-overwrite');
    let pendingOverwriteFile = null;
    let pendingOverwritePath = null;

    uploadBtn.addEventListener('click', () => {
      if (!selectedFile) return;
      // Ask for the lock here, synchronously in the gesture, not later in
      // doMultipartUpload — that runs after the check-key round trip, by which
      // point any transient activation has expired. MDN's examples acquire from
      // a click for exactly this reason, on every engine.
      acquireWakeLock('click');
      checkDuplicateThenUpload(selectedFile, customPath.value.trim());
    });

    btnOverwrite.addEventListener('click', () => {
      dupWarning.hidden = true;
      if (pendingOverwriteFile) {
        acquireWakeLock('click'); // fresh gesture; the check-key pause released it
        doMultipartUpload(pendingOverwriteFile, pendingOverwritePath, true);
        pendingOverwriteFile = null;
        pendingOverwritePath = null;
      }
    });

    btnCancelOverwrite.addEventListener('click', () => {
      dupWarning.hidden = true;
      pendingOverwriteFile = null;
      pendingOverwritePath = null;
      releaseWakeLock();
      uploadBtn.disabled = false;
      uploadBtn.textContent = '🚀 上传';
    });

    async function checkDuplicateThenUpload(file, path) {
      uploadBtn.disabled = true;
      uploadBtn.textContent = '⏳ 检查重名...';
      uploadResult.hidden = true;
      dupWarning.hidden = true;

      try {
        const checkResp = await fetch('/admin/api/files/check-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: file.name,
            path: path || undefined,
          }),
        });
        if (!checkResp.ok) {
          // If check fails, proceed anyway — server will catch duplicates
          doMultipartUpload(file, path, false);
          return;
        }
        const checkData = await checkResp.json();

        if (checkData.exists) {
          // No upload is starting — hand the lock back rather than holding the
          // screen awake while the dialog waits for a decision. If the admin
          // abandons the dialog instead of answering, the browser releases the
          // lock itself the moment the tab is hidden, so the worst case is
          // bounded. The other exits from this function (check failed, or it
          // threw) fall through to doMultipartUpload and keep the lock.
          releaseWakeLock();
          dupKeyEl.textContent = checkData.path;
          dupWarning.hidden = false;
          pendingOverwriteFile = file;
          pendingOverwritePath = path;
          uploadBtn.textContent = '🚀 上传';
        } else {
          doMultipartUpload(file, path, false);
        }
      } catch (_) {
        // Check failed — proceed anyway
        doMultipartUpload(file, path, false);
      }
    }

    async function doMultipartUpload(file, path, overwrite) {
      uploadBtn.disabled = true;
      uploadBtn.textContent = '⏳ 准备上传...';
      progressWrapper.hidden = false;
      progressBar.style.width = '0%';
      document.getElementById('progress-text').textContent = '';
      uploadResult.hidden = true;
      dupWarning.hidden = true;

      uploadInProgress = true;
      acquireWakeLock('upload').then(setWakeHint);

      let uploadId = null;
      let key = null;   // R2 object name, minted by the server
      let uploadPath = null;  // display path the row will be listed under

      try {
        // 1. Start multipart upload
        uploadBtn.textContent = '⏳ 创建上传...';
        const startResp = await fetch('/admin/api/upload/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: file.name,
            content_type: file.type || 'application/octet-stream',
            path: path || undefined,
            overwrite: overwrite || false,
          }),
        });
        if (!startResp.ok) {
          const errData = await startResp.json().catch(() => ({}));
          if (startResp.status === 409 && errData.error === 'duplicate') {
            showResult(false, `❌ 文件已存在: ${errData.path}。请刷新页面后重试。`);
            return;
          }
          throw new Error(`Start failed: ${startResp.status}`);
        }
        const startData = await startResp.json();
        uploadId = startData.upload_id;
        key = startData.key;
        uploadPath = startData.path;

        // 2. Upload chunks — ensure at least 1 part (R2 requires ≥1 part, even for 0-byte files)
        const totalChunks = Math.max(1, Math.ceil(file.size / CHUNK_SIZE));
        const parts = [];
        let uploadedBytes = 0;

        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunk = file.slice(start, end);

          uploadBtn.textContent = `⏳ 上传中 ${i + 1}/${totalChunks}...`;

          const part = await uploadChunk(uploadId, key, i + 1, chunk, (chunkLoaded) => {
            const total = uploadedBytes + chunkLoaded;
            const pct = Math.round((total / file.size) * 100);
            progressBar.style.width = pct + '%';
            document.getElementById('progress-text').textContent =
              `${formatSize(total)} / ${formatSize(file.size)}`;
          });

          parts.push(part);
          uploadedBytes += chunk.size;
        }

        // 3. Complete
        uploadBtn.textContent = '⏳ 完成中...';
        progressBar.style.width = '100%';
        const completeResp = await fetch(
          `/admin/api/upload/complete?upload_id=${encodeURIComponent(uploadId)}&key=${encodePath(key)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              parts: parts.map(p => ({ n: p.part_number, etag: p.etag })),
              content_type: file.type || 'application/octet-stream',
              path: uploadPath,
            }),
          }
        );
        if (!completeResp.ok) {
          throw new Error(await errorMessage(completeResp));
        }
        const completeData = await completeResp.json();

        showResult(true, `✅ 上传成功! ${completeData.path} (${formatSize(completeData.size)})`);
        customPath.value = '';
        selectedFile = null;
        fileInput.value = '';
        document.querySelector('.upload-zone-text').textContent = '点击或拖拽到此处';
        document.querySelector('.upload-zone-hint').textContent = '支持图片、视频、音频';
        loadFiles();

      } catch (err) {
        console.error('Upload error:', err);
        showResult(false, `❌ 上传失败: ${err.message}`);
        // Abort multipart upload on error
        if (uploadId && key) {
          try {
            await fetch(
              `/admin/api/upload?upload_id=${encodeURIComponent(uploadId)}&key=${encodePath(key)}`,
              { method: 'DELETE' }
            );
          } catch (_) { /* ignore abort errors */ }
        }
      } finally {
        // Drop the lock as soon as the upload settles — the timeout below only
        // lets the finished progress bar linger, and the screen shouldn't be
        // held awake for that.
        uploadInProgress = false;
        releaseWakeLock();
        uploadBtn.disabled = true;
        uploadBtn.textContent = '🚀 上传';
        setTimeout(() => {
          progressWrapper.hidden = true;
          wakeHint.hidden = true;
        }, 1500);
      }
    }

    function uploadChunk(uploadId, key, partNumber, blob, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(e.loaded);
          }
        });

        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              resolve(JSON.parse(xhr.responseText));
            } catch (e) {
              reject(new Error(`Part ${partNumber}: invalid JSON response`));
            }
          } else {
            reject(new Error(`Part ${partNumber}: HTTP ${xhr.status} — ${xhr.responseText?.substring(0, 200)}`));
          }
        });

        xhr.addEventListener('error', () => reject(new Error(`Part ${partNumber}: network error`)));

        const params = new URLSearchParams({
          upload_id: uploadId,
          key: key,
          n: partNumber,
        });
        xhr.open('PUT', `/admin/api/upload/part?${params}`);
        xhr.send(blob);
      });
    }

    function showResult(success, msg) {
      uploadResult.hidden = false;
      uploadResult.className = 'upload-result ' + (success ? 'success' : 'error');
      uploadResult.textContent = msg;
    }

    // Load files
    async function loadFiles() {
      try {
        const resp = await fetch('/admin/api/files');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        renderFileList(data.files || []);
      } catch (err) {
        const li = document.createElement('li');
        li.className = 'file-list-item';
        li.style.cssText = 'justify-content:center; color: #C0392B;';
        li.textContent = '❌ 加载失败: ' + err.message;
        fileListEl.replaceChildren(li);
      }
    }

    function renderFileList(files) {
      if (files.length === 0) {
        fileListEl.innerHTML = `<li class="file-list-item" style="justify-content:center; color: var(--text-light);">
          💤 还没有文件~
        </li>`;
        return;
      }

      // Built with DOM APIs, not string interpolation: keys are user-controlled
      // (filename / custom path) and an inline onclick="...'${key}'..." can be
      // escaped out of with an HTML entity such as &#39;.
      fileListEl.replaceChildren(...files.map(f => {
        // `f.path` is the display name (what rename moves); `f.key` is the
        // immutable R2 object. Older rows have no path — fall back to key.
        const path = f.path || f.key;

        const li = document.createElement('li');
        li.className = 'file-list-item';

        const name = document.createElement('span');
        name.className = 'file-list-name';
        name.title = path;
        name.textContent = '✨ ' + path;

        const size = document.createElement('span');
        size.className = 'file-list-size';
        size.textContent = formatSize(f.size);

        const actions = document.createElement('div');
        actions.className = 'file-list-actions';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'btn-file-action btn-rename';
        renameBtn.textContent = '✏️ 重命名';
        renameBtn.addEventListener('click', () => renameFile(path));

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-file-action';
        delBtn.textContent = '🗑 删除';
        delBtn.addEventListener('click', () => deleteFile(path));

        actions.append(renameBtn, delBtn);
        li.append(name, size, actions);
        return li;
      }));
    }

    // Read the server's explanation off a failed response.
    // Worker errors come back as a plain-text body, so calling resp.json()
    // on them throws a parse error that hides the real cause behind a
    // misleading "网络错误".
    async function errorMessage(resp) {
      let text = '';
      try {
        text = await resp.text();
      } catch (_) {
        return `HTTP ${resp.status}`;
      }
      try {
        const data = JSON.parse(text);
        if (data && (data.message || data.error)) return data.message || data.error;
      } catch (_) {
        // Not JSON — fall through and show the raw body.
      }
      return text.trim() ? `HTTP ${resp.status}: ${text.trim().slice(0, 300)}` : `HTTP ${resp.status}`;
    }

    async function deleteFile(path) {
      if (!confirm(`确认删除 "${path}"?`)) return;
      try {
        const resp = await fetch(`/admin/api/files/${encodePath(path)}`, { method: 'DELETE' });
        if (resp.ok) {
          loadFiles();
        } else {
          alert('删除失败: ' + await errorMessage(resp));
        }
      } catch (err) {
        alert('网络错误: ' + err.message);
      }
    }

    // ── Rename ──
    // Takes the display path. Since migration 0002 this is a D1-only update —
    // no R2 copy — so it returns immediately whatever the file's size.
    function renameFile(oldPath) {
      // Extract just the filename portion for the default value
      const filename = oldPath.split('/').pop() || oldPath;

      // Build a simple modal
      const overlay = document.createElement('div');
      overlay.className = 'rename-dialog-overlay';
      // No path interpolation into markup — `oldPath`/`filename` go in via
      // textContent/.value so an HTML entity in the name can't break out.
      overlay.innerHTML = `
        <div class="rename-dialog">
          <h3>✏️ 重命名文件</h3>
          <div class="rename-oldpath" style="font-size:0.85rem;color:var(--text-light);margin-bottom:0.5rem;"></div>
          <label style="font-weight:500;font-size:0.9rem;">新文件名</label>
          <input type="text" id="rename-input" autofocus>
          <div class="rename-hint">只改文件名，保留目录路径。输入完整路径可移动到其他目录。</div>
          <div class="rename-dialog-actions">
            <button class="btn-rename-cancel">取消</button>
            <button class="btn-rename-confirm">确认重命名</button>
          </div>
        </div>
      `;
      overlay.querySelector('.rename-oldpath').textContent = '原路径: ' + oldPath;
      document.body.appendChild(overlay);

      const input = overlay.querySelector('#rename-input');
      input.value = filename;
      const confirmBtn = overlay.querySelector('.btn-rename-confirm');
      const cancelBtn = overlay.querySelector('.btn-rename-cancel');

      // Focus and select the name part (without extension)
      const dotIdx = filename.lastIndexOf('.');
      if (dotIdx > 0) {
        input.setSelectionRange(0, dotIdx);
      } else {
        input.select();
      }

      async function doRename() {
        const newName = input.value.trim();
        if (!newName) { alert('文件名不能为空'); return; }
        if (newName === filename) { closeDialog(); return; }

        // Build new path: replace the last segment (filename) with new name
        const parts = oldPath.split('/');
        parts[parts.length - 1] = newName;
        const newPath = parts.join('/');

        confirmBtn.disabled = true;
        confirmBtn.textContent = '⏳ ...';

        try {
          const resp = await fetch('/admin/api/files/rename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ old_path: oldPath, new_path: newPath }),
          });
          if (resp.ok) {
            closeDialog();
            loadFiles();
          } else {
            alert('重命名失败: ' + await errorMessage(resp));
            confirmBtn.disabled = false;
            confirmBtn.textContent = '确认重命名';
          }
        } catch (err) {
          alert('网络错误: ' + err.message);
          confirmBtn.disabled = false;
          confirmBtn.textContent = '确认重命名';
        }
      }

      function closeDialog() {
        overlay.remove();
        document.removeEventListener('keydown', onKey);
      }

      function onKey(e) {
        if (e.key === 'Escape') closeDialog();
        if (e.key === 'Enter') doRename();
      }

      confirmBtn.addEventListener('click', doRename);
      cancelBtn.addEventListener('click', closeDialog);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeDialog();
      });
      document.addEventListener('keydown', onKey);
      input.focus();
    }

    function encodePath(key) {
      return key.split('/').map(encodeURIComponent).join('/');
    }

    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(i > 0 ? 1 : 0) + ' ' + sizes[i];
    }


    // Initial load
    loadFiles();
  </script>
</body>
</html>
