<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💫 きらきら</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-decorations" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>
    <div class="header-content">
      <h1 class="site-title">
        <span class="title-sparkle">💫</span>
        きらきら
        <span class="title-sparkle">💫</span>
      </h1>
    </div>
    <div class="header-paws" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>
  </header>

  <nav class="filter-bar" aria-label="筛选">
    <button class="filter-btn active" data-filter="all" aria-pressed="true">
      ✨ 全部
    </button>
    <button class="filter-btn" data-filter="image" aria-pressed="false">
      🖼️ 图片
    </button>
    <button class="filter-btn" data-filter="video" aria-pressed="false">
      🎬 视频
    </button>
    <button class="filter-btn" data-filter="audio" aria-pressed="false">
      🎵 音频
    </button>
  </nav>

  <main id="gallery" class="gallery-grid" aria-label="切片画廊">
    <!-- Cards rendered by JavaScript -->
  </main>

  <div id="spinner" class="spinner" hidden aria-label="加载中">
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
  </div>

  <div id="empty-state" class="empty-state" hidden>
    <div class="empty-emoji">💤</div>
    <p class="empty-title">还没有切片呢...</p>
    <p class="empty-subtitle">等主人来投喂~ 🍰</p>
  </div>

  <div id="error-box" class="error-box" hidden>
    <div class="error-emoji">💦</div>
    <p class="error-title">呜...出了一点小问题</p>
    <p class="error-detail" id="error-detail"></p>
    <button id="retry-btn" class="btn-retry">🔄 再试一下</button>
  </div>

  <div class="load-more-wrapper" id="load-more-wrapper" hidden>
    <button id="load-more-btn" class="btn-load-more">
      🐾 もっと 🐾
    </button>
  </div>

  <!-- Preview Modal -->
  <div id="preview-modal" class="modal" role="dialog" aria-modal="true" aria-label="预览" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" aria-label="关闭">✕</button>
      <div id="modal-media" class="modal-media"></div>
      <div class="modal-info">
        <span id="modal-filename" class="modal-filename"></span>
        <button id="modal-clip-btn" class="btn-download" style="margin-right:0.3rem;" title="切片">✂️</button>
        <button id="modal-download" class="btn-download">💾</button>
      </div>
      <div id="clip-panel" class="clip-panel" hidden>
        <div class="clip-panel-header">
          <h3>✂️ 切片</h3>
          <button class="clip-panel-close" id="clip-panel-close">✕</button>
        </div>
        <div class="clip-panel-list" id="clip-panel-list"></div>
        <div class="clip-panel-footer">
          <a id="clip-page-link" href="#" class="btn-load-more" style="display:inline-block;text-decoration:none;padding:0.4rem 1rem;font-size:0.85rem;">📝 打开切片页面</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-paws">🐾 🐾 🐾</div>
    <p>💖 with 🐾</p>
  </footer>

  <script defer src="app.js"></script>
</body>
</html>
