<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💫 きらきら</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-decorations" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>
    <div class="header-content">
      <h1 class="site-title">
        <span class="title-sparkle">💫</span>
        きらきら
        <span class="title-sparkle">💫</span>
      </h1>
    </div>
    <div class="header-paws" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>
  </header>

  <!-- The announcement button rides in the filter row rather than owning a row
       of its own: on its own line it cost a full band of vertical space above
       the fold for one pill. It is not a filter, so it stays outside the <nav>
       and only shares the row. Hidden entirely when there is nothing to say. -->
  <div class="filter-row">
    <nav class="filter-bar" aria-label="筛选">
      <button class="filter-btn active" data-filter="all" aria-pressed="true">
        ✨ 全部
      </button>
      <button class="filter-btn" data-filter="image" aria-pressed="false">
        🖼️ 图片
      </button>
      <button class="filter-btn" data-filter="video" aria-pressed="false">
        🎬 视频
      </button>
      <button class="filter-btn" data-filter="audio" aria-pressed="false">
        🎵 音频
      </button>
    </nav>
    <div class="notice-launcher" id="notice-launcher" hidden>
      <button class="notice-open-btn" id="notice-open" aria-haspopup="dialog">
        <span aria-hidden="true">📢</span>
        <span>公告</span>
        <span class="notice-bar-count" id="notice-bar-count"></span>
      </button>
    </div>
  </div>

  <!-- Clip rank. Above the gallery on purpose: the gallery is a list of source
       files, this is a list of the moments people actually came for. Collapsed
       to one row of controls until it has something to show. -->
  <section class="clip-rank" id="clip-rank" hidden aria-label="切片排行">
    <div class="clip-rank-head">
      <h2 class="clip-rank-title">🏆 切片排行</h2>
      <div class="rank-tabs" role="tablist">
        <button class="rank-tab active" id="rank-tab-likes" role="tab" aria-selected="true">❤️ 最热</button>
        <button class="rank-tab" id="rank-tab-time" role="tab" aria-selected="false">🆕 最新</button>
      </div>
    </div>
    <div class="clip-rank-list" id="clip-rank-list"></div>
    <button class="rank-more" id="rank-more" hidden>加载更多</button>
  </section>

  <main id="gallery" class="gallery-grid" aria-label="切片画廊">
    <!-- Cards rendered by JavaScript -->
  </main>

  <div id="spinner" class="spinner" hidden aria-label="加载中">
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
  </div>

  <div id="empty-state" class="empty-state" hidden>
    <div class="empty-emoji">💤</div>
    <p class="empty-title">还没有切片呢...</p>
    <p class="empty-subtitle">等主人来投喂~ 🍰</p>
  </div>

  <div id="error-box" class="error-box" hidden>
    <div class="error-emoji">💦</div>
    <p class="error-title">呜...出了一点小问题</p>
    <p class="error-detail" id="error-detail"></p>
    <button id="retry-btn" class="btn-retry">🔄 再试一下</button>
  </div>

  <div class="load-more-wrapper" id="load-more-wrapper" hidden>
    <button id="load-more-btn" class="btn-load-more">
      🐾 もっと 🐾
    </button>
  </div>

  <!-- Preview Modal -->
  <div id="preview-modal" class="modal" role="dialog" aria-modal="true" aria-label="预览" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" aria-label="关闭">✕</button>
      <div id="modal-media" class="modal-media"></div>
      <div class="source-selector" id="source-selector" hidden>
        <label for="source-select">📺 来源:</label>
        <select id="source-select"></select>
        <span class="source-note" id="source-note"></span>
      </div>
      <div class="modal-info">
        <span id="modal-filename" class="modal-filename"></span>
        <button id="modal-clip-btn" class="btn-download btn-clip" title="切片">✂️</button>
        <button id="modal-download" class="btn-download">💾</button>
      </div>
      <div id="clip-panel" class="clip-panel" hidden>
        <div class="clip-panel-header">
          <h3>✂️ 切片</h3>
          <button class="clip-panel-close" id="clip-panel-close">✕</button>
        </div>
        <div class="clip-panel-list" id="clip-panel-list"></div>
        <div class="clip-panel-footer">
          <a id="clip-page-link" href="#" class="btn-load-more clip-page-link">📝 打开切片页面</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Announcement modal. A sibling of the preview modal rather than a reuse of
       it: that one is torn down and rebuilt per file, this one is rendered once
       from the feed and just shown. -->
  <div id="notice-modal" class="modal notice-modal" role="dialog" aria-modal="true"
       aria-labelledby="notice-modal-title" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card notice-modal-card">
      <div class="notice-modal-head">
        <h2 id="notice-modal-title">📢 公告</h2>
        <button class="modal-close" id="notice-modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="notice-list" id="notice-feed"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-paws">🐾 🐾 🐾</div>
    <p>💖 with 🐾</p>
  </footer>

  <script defer src="mp4clip.js"></script>
  <script defer src="codecs.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
